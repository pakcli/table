name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Plugin
        run: npm run build

      - name: Generate Build Attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Package and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p tablite
          cp main.js styles.css manifest.json tablite/
          zip -r tablite-${tag}.zip tablite/
          gh release create "$tag"             --title="Tablite ${tag}"             --generate-notes             tablite-${tag}.zip main.js styles.css manifest.json || gh release upload "$tag" tablite-${tag}.zip main.js styles.css manifest.json --clobber
